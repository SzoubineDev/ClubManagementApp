name: Deploy Laravel to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # InfinityFree runs PHP 8.2/8.3, so build the vendor folder with a
          # matching version instead of the runner's default PHP.
          php-version: '8.2'
          extensions: dom, mbstring, curl, fileinfo, gd, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        env:
          APP_ENV: production
          APP_DEBUG: 'false'

      - name: Verify PDF dependencies
        run: |
          php -r "require 'vendor/autoload.php'; if (!class_exists('Barryvdh\\DomPDF\\Facade\\Pdf')) { fwrite(STDERR, 'barryvdh/laravel-dompdf is missing'.PHP_EOL); exit(1); } if (!class_exists('Dompdf\\Dompdf')) { fwrite(STDERR, 'dompdf/dompdf is missing'.PHP_EOL); exit(1); } echo 'PDF dependencies installed'.PHP_EOL;"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Restore FTP sync state
        uses: actions/cache/restore@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-${{ github.run_id }}
          restore-keys: |
            ftp-sync-

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dry-run: false
          log-level: minimal
          timeout: 120000
          # vendor is generated by the "Install Composer dependencies" step
          # above and must be uploaded, otherwise packages added to
          # composer.json (such as barryvdh/laravel-dompdf) never reach
          # production and /documents/room-request fails with a 500.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/**
            **/public/storage/**
            **/public/hot
            **/vendor.zip
            **/.phpunit.result.cache
            **/.phpunit.cache/**

      - name: Save FTP sync state
        if: success() && hashFiles('.ftp-deploy-sync-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .ftp-deploy-sync-state.json
          key: ftp-sync-${{ github.run_id }}

